name: qredet
description: "Qredet wallet home screen."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  get_it: ^8.2.0
  injectable: ^2.5.1
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.1
  intl: ^0.20.2
  fpdart: ^1.1.1
  flutter_svg: ^2.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.9.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  injectable_generator: ^2.9.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_gen_runner: ^5.11.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/countries.json

  fonts:
    - family: Mona Sans
      fonts:
        - asset: assets/fonts/MonaSans-Variable.ttf
          weight: 200
        - asset: assets/fonts/MonaSans-Variable.ttf
          weight: 300
        - asset: assets/fonts/MonaSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/MonaSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/MonaSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/MonaSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/MonaSans-Variable.ttf
          weight: 800
        - asset: assets/fonts/MonaSans-Variable.ttf
          weight: 900

flutter_gen:
  output: lib/gen/
  line_length: 100
